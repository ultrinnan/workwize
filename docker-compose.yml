services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: workwize
      MYSQL_USER: workwize
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:e2oA14laemfAao8XRgebSmxu6QkMsnhyeLNlUgY+t0k="
      APP_URL: http://localhost:8001
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: workwize
      DB_USERNAME: workwize
      DB_PASSWORD: secret
      MDM_PROVIDER: jamf
      LOG_CHANNEL: stderr
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  db-data:
